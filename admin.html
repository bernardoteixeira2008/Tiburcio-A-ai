<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Tiburcio Açaí — Painel de Promoções</title>
<style>
  :root{
    --roxo-escuro:#2C0A33; --roxo-vivo:#9B2FAE; --rosa:#D6489B;
    --creme:#FBF3E7; --texto:#241226; --texto-suave:#6b5a70; --verde:#2ecc71; --vermelho:#e74c3c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family: system-ui, -apple-system, sans-serif; background: var(--creme);
    color: var(--texto); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .card{ background:#fff; border-radius:18px; padding:28px; max-width:480px; width:100%; box-shadow: 0 12px 30px -12px rgba(44,10,51,.35); }
  h1{ font-size:20px; margin:0 0 6px; color: var(--roxo-escuro); }
  p.sub{ font-size:13px; color: var(--texto-suave); margin:0 0 20px; }
  input[type="password"]{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid rgba(44,10,51,.2);
    font-size:15px; margin-bottom:14px;
  }
  button.btn{
    width:100%; padding:12px; border-radius:999px; border:none; font-weight:700; font-size:14px;
    background: linear-gradient(135deg, var(--roxo-vivo), var(--rosa)); color:#fff; cursor:pointer;
  }
  .erro{ color: var(--vermelho); font-size:13px; margin-bottom:10px; display:none; }

  .promo-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 0; border-bottom:1px solid rgba(44,10,51,.08);
  }
  .promo-item:last-child{ border-bottom:none; }
  .promo-info h3{ font-size:14.5px; margin:0 0 3px; }
  .promo-info p{ font-size:12px; color: var(--texto-suave); margin:0; }
  .promo-valor{ display:flex; align-items:center; gap:6px; margin-top:6px; }
  .promo-valor input{
    width:64px; padding:6px 8px; border-radius:8px; border:1.5px solid rgba(44,10,51,.2); font-size:13px;
  }
  .promo-valor span{ font-size:12px; color: var(--texto-suave); }

  /* Switch liga/desliga */
  .switch{ position:relative; flex:none; width:48px; height:28px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:999px; transition:.2s;
  }
  .slider::before{
    content:""; position:absolute; height:22px; width:22px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.2s;
  }
  input:checked + .slider{ background: var(--verde); }
  input:checked + .slider::before{ transform: translateX(20px); }

  .status{ text-align:center; font-size:13px; margin-top:16px; min-height:18px; }
  .status.ok{ color: var(--verde); }
  .status.erro{ color: var(--vermelho); }
  .sair{ display:block; text-align:center; margin-top:18px; font-size:12.5px; color: var(--texto-suave); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>

<div class="card" id="telaLogin">
  <h1>🍇 Painel de Promoções</h1>
  <p class="sub">Digite a senha de acesso combinada com o desenvolvedor.</p>
  <p class="erro" id="erroLogin">Senha incorreta.</p>
  <input type="password" id="campoSenha" placeholder="Senha" />
  <button class="btn" id="btnEntrar">Entrar</button>
</div>

<div class="card" id="telaPainel" style="display:none; max-width:600px;">
  <h1>🍇 Promoções</h1>
  <p class="sub">Ative ou desative cada promoção. As mudanças aparecem no site em poucos segundos.</p>
  <div id="listaPromocoes"></div>
  <div class="status" id="statusSalvar"></div>
  <span class="sair" id="btnSair">Sair</span>
</div>

<script>
  // ------------------------------------------------------------
  // CONFIGURAÇÃO — troque a senha aqui quando quiser.
  // Atenção: essa senha é só uma proteção simples contra acesso
  // casual (não é criptografada). Não use dado sensível de verdade
  // protegido por ela.
  // ------------------------------------------------------------
  const SENHA_PAINEL = "Mrxa7090"; // <-- TROQUE ESSA SENHA

  const SUPABASE_URL = "https://bmsgygpjubdzauxlztth.supabase.co";
  const SUPABASE_KEY = "sb_publishable_9oiY-0Ys7DjSYqsvVBy9A_0rt_lGiy";

  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    Prefer: "return=representation",
  };

  let promocoes = [];

  document.getElementById("btnEntrar").addEventListener("click", tentarLogin);
  document.getElementById("campoSenha").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tentarLogin();
  });
  document.getElementById("btnSair").addEventListener("click", () => {
    sessionStorage.removeItem("painelLogado");
    location.reload();
  });

  function tentarLogin() {
    const senha = document.getElementById("campoSenha").value;
    if (senha === SENHA_PAINEL) {
      sessionStorage.setItem("painelLogado", "1");
      abrirPainel();
    } else {
      document.getElementById("erroLogin").style.display = "block";
    }
  }

  async function abrirPainel() {
    document.getElementById("telaLogin").style.display = "none";
    document.getElementById("telaPainel").style.display = "block";
    await carregarPromocoes();
  }

  async function carregarPromocoes() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/promocoes?select=*&order=nome`, { headers });
    promocoes = await res.json();
    renderLista();
  }

  function renderLista() {
    const container = document.getElementById("listaPromocoes");
    container.innerHTML = promocoes
      .map((p) => {
        const temValor = p.valor !== null && p.valor !== undefined;
        return `
        <div class="promo-item">
          <div class="promo-info">
            <h3>${p.nome}</h3>
            <p>${p.descricao || ""}</p>
            ${
              temValor
                ? `<div class="promo-valor">
                     <span>Valor:</span>
                     <input type="number" step="0.01" data-id="${p.id}" class="campo-valor" value="${p.valor}" />
                   </div>`
                : ""
            }
          </div>
          <label class="switch">
            <input type="checkbox" data-id="${p.id}" class="campo-ativa" ${p.ativa ? "checked" : ""} />
            <span class="slider"></span>
          </label>
        </div>`;
      })
      .join("");

    container.querySelectorAll(".campo-ativa").forEach((el) => {
      el.addEventListener("change", () => salvarPromocao(el.dataset.id));
    });
    container.querySelectorAll(".campo-valor").forEach((el) => {
      el.addEventListener("change", () => salvarPromocao(el.dataset.id));
    });
  }

  async function salvarPromocao(id) {
    const ativaEl = document.querySelector(`.campo-ativa[data-id="${id}"]`);
    const valorEl = document.querySelector(`.campo-valor[data-id="${id}"]`);
    const status = document.getElementById("statusSalvar");

    const body = { ativa: ativaEl.checked };
    if (valorEl) body.valor = parseFloat(valorEl.value);

    status.textContent = "Salvando...";
    status.className = "status";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/promocoes?id=eq.${id}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("Erro ao salvar");
      status.textContent = "✅ Salvo! Já está valendo no site.";
      status.className = "status ok";
    } catch (e) {
      status.textContent = "❌ Não deu pra salvar — confira sua internet e tente de novo.";
      status.className = "status erro";
    }
  }

  // Mantém logado durante a sessão do navegador
  if (sessionStorage.getItem("painelLogado") === "1") {
    abrirPainel();
  }
</script>
</body>
</html>
