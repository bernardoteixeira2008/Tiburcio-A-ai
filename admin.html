<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Tiburcio Açaí — Painel</title>
<style>
  :root{
    --roxo-escuro:#2C0A33; --roxo-vivo:#9B2FAE; --rosa:#D6489B;
    --creme:#FBF3E7; --texto:#241226; --suave:#6b5a70; --verde:#2ecc71; --vermelho:#d93a2b; --linha:rgba(44,10,51,.1);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--creme); color: var(--texto); }
  button{ font-family:inherit; cursor:pointer; }
  h1{ font-size:19px; margin:0; color: var(--roxo-escuro); }
  h2{ font-size:17px; margin:0 0 10px; color: var(--roxo-escuro); }
  h3{ font-size:14px; margin:18px 0 6px; color: var(--roxo-escuro); }

  /* login */
  .centro{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:#fff; border-radius:18px; padding:28px; max-width:420px; width:100%; box-shadow:0 12px 30px -12px rgba(44,10,51,.35); }
  .sub{ font-size:13px; color: var(--suave); margin:6px 0 18px; }

  /* topo e abas */
  .topo{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; background:#fff; border-bottom:1px solid var(--linha); flex-wrap:wrap; }
  .usuario{ font-size:12px; color: var(--suave); margin-right:8px; word-break:break-all; }
  .abas{ display:flex; gap:6px; padding:10px 16px 0; max-width:760px; margin:0 auto; overflow-x:auto; }
  .abas button{ border:none; background:#fff; padding:10px 16px; border-radius:12px 12px 0 0; font-weight:700; font-size:13.5px; color: var(--suave); white-space:nowrap; }
  .abas button.ativa{ background: var(--roxo-escuro); color:#fff; }
  .pagina{ max-width:760px; margin:0 auto; padding:0 16px 40px; }
  .painel{ background:#fff; border-radius:0 14px 14px 14px; padding:18px; box-shadow:0 8px 22px -14px rgba(44,10,51,.35); }

  .aviso{ max-width:760px; margin:10px auto 0; padding:0 16px; font-size:13px; min-height:18px; }
  .aviso.ok{ color:#1e9e57; } .aviso.erro{ color: var(--vermelho); }

  /* botões */
  .btn{ border:none; border-radius:999px; padding:11px 20px; font-weight:700; font-size:14px; color:#fff; background: linear-gradient(135deg, var(--roxo-vivo), var(--rosa)); }
  .btn:disabled{ opacity:.6; cursor:wait; }
  .btn-sec{ border:1.5px solid rgba(44,10,51,.25); border-radius:999px; padding:10px 18px; font-weight:600; font-size:14px; background:#fff; color: var(--texto); }
  .btn-perigo{ border:1.5px solid var(--vermelho); color: var(--vermelho); background:#fff; border-radius:999px; padding:10px 16px; font-weight:600; font-size:13px; }
  .btn-mini{ border:1.5px solid rgba(44,10,51,.2); background:#fff; border-radius:9px; padding:6px 10px; font-size:13px; line-height:1; color: var(--texto); display:inline-flex; align-items:center; }
  .link{ border:none; background:none; color: var(--suave); text-decoration:underline; font-size:12.5px; padding:4px; }
  .barra{ display:flex; justify-content:flex-end; margin-bottom:12px; }

  /* listas */
  .secao-titulo{ display:flex; align-items:center; gap:8px; margin:18px 0 6px; }
  .secao-titulo:first-of-type{ margin-top:0; }
  .linha{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--linha); }
  .linha:last-child{ border-bottom:none; }
  .mini{ flex:none; width:46px; height:46px; border-radius:10px; background:#2C0A33 center/contain no-repeat; display:inline-block; }
  .info{ flex:1; min-width:0; }
  .info strong{ display:block; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; }
  .info small{ display:block; font-size:12px; color: var(--suave); }
  .acoes{ display:flex; gap:6px; align-items:center; flex:none; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:#F0D9A0; color:#6d4b05; margin-left:6px; }
  .vazio{ font-size:13px; color: var(--suave); padding:8px 0; }
  @media (max-width: 560px){
    .linha{ flex-wrap:wrap; }
    .info{ flex:1 1 150px; }
    .acoes{ flex:0 0 100%; justify-content:flex-end; }
    .info strong{ overflow:visible; }
    .painel{ padding:14px; }
  }

  /* chave liga/desliga */
  .switch{ position:relative; flex:none; width:44px; height:26px; display:inline-block; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#cfc6d1; border-radius:999px; cursor:pointer; transition:.2s; }
  .slider::before{ content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background: var(--verde); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  /* janela (modal) */
  .modal-fundo{ position:fixed; inset:0; background:rgba(36,18,38,.55); display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto; z-index:50; }
  .modal{ background:#fff; border-radius:16px; padding:22px; width:100%; max-width:560px; box-shadow:0 20px 50px -10px rgba(0,0,0,.4); }
  .campo{ display:block; font-size:13px; font-weight:600; margin-bottom:12px; }
  .campo input[type="text"], .campo input[type="email"], .campo input[type="password"], .campo select, input.campo-texto{
    display:block; width:100%; margin-top:5px; padding:10px 12px; border-radius:10px; border:1.5px solid rgba(44,10,51,.2); font-size:14.5px; font-family:inherit; background:#fff;
  }
  .check{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin:8px 0; }
  .check input{ width:18px; height:18px; accent-color: var(--roxo-vivo); }
  .check small{ color: var(--suave); }
  .dica{ font-size:12.5px; color: var(--suave); margin:0 0 8px; }
  .erro{ color: var(--vermelho); font-size:13px; margin:0 0 12px; }
  .rodape-modal{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .rodape-modal .esq{ margin-right:auto; }
  .foto-area{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .foto-prev{ width:84px; height:84px; object-fit:contain; background:#2C0A33; border-radius:12px; }
  .sem-foto{ width:84px; height:84px; border-radius:12px; background:#eee6ef; color: var(--suave); font-size:12px; display:flex; align-items:center; justify-content:center; }
  .sabor-linha{ display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .sabor-linha input[type="text"]{ flex:1; min-width:130px; padding:8px 10px; border-radius:9px; border:1.5px solid rgba(44,10,51,.2); font-size:14px; }
  .sabor-linha .check{ margin:0; }
  .lista-marcar{ max-height:190px; overflow:auto; border:1.5px solid var(--linha); border-radius:10px; padding:4px 10px; margin:6px 0 4px; }
  .lista-marcar h4{ margin:8px 0 2px; font-size:12px; color: var(--suave); }
  .duas-colunas{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .campo input[type="number"], .campo input[type="date"], .campo textarea{ display:block; width:100%; margin-top:5px; padding:10px 12px; border-radius:10px; border:1.5px solid rgba(44,10,51,.2); font-size:14.5px; font-family:inherit; background:#fff; }
  small.nota{ display:block; font-size:12px; color: var(--suave); margin-top:4px; }
  .promo-valor{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color: var(--suave); }
  .promo-valor input{ width:80px; padding:6px 8px; border-radius:8px; border:1.5px solid rgba(44,10,51,.2); font-size:13px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="centro" id="telaLogin">
  <div class="card">
    <h1>🍇 Painel Tiburcio Açaí</h1>
    <p class="sub">Entre com seu e-mail e senha.</p>
    <p class="erro" id="erroLogin" hidden></p>
    <form id="formLogin">
      <label class="campo">E-mail
        <input type="email" id="campoEmail" autocomplete="username" required />
      </label>
      <label class="campo">Senha
        <input type="password" id="campoSenha" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn" id="btnEntrar" style="width:100%">Entrar</button>
    </form>
  </div>
</div>

<!-- ============ PAINEL ============ -->
<div id="app" hidden>
  <header class="topo">
    <h1>🍇 Painel Tiburcio Açaí</h1>
    <div><span class="usuario" id="textoUsuario"></span><button class="link" id="btnSair" type="button">Sair</button></div>
  </header>
  <nav class="abas" id="abas">
    <button type="button" data-aba="produtos" class="ativa">Produtos</button>
    <button type="button" data-aba="complementos">Complementos</button>
    <button type="button" data-aba="categorias">Categorias</button>
    <button type="button" data-aba="promocoes">Promoções</button>
  </nav>
  <div class="aviso" id="aviso" aria-live="polite"></div>
  <div class="pagina"><div class="painel" id="conteudo"></div></div>
</div>

<div class="modal-fundo" id="modalFundo" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
  /* ============================================================
     Este arquivo NÃO guarda senha. O acesso é por e-mail e senha
     dos usuários criados no Supabase. A chave abaixo é a chave
     PÚBLICA do projeto (a mesma do site).
     ============================================================ */
  const SUPABASE_URL = "https://bmsgygpjubdzauxlztth.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtc2d5Z3BqdWJkemF1eGx6dHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjg3NTYsImV4cCI6MjEwNDgwNDc1Nn0.ppi8E0KH_wzoP2OsFgPkSAOgneDMJLKxWQ_Dmi9qMbw";
  const BUCKET = "fotos";
  const CHAVE_SESSAO = "tiburcioPainelSessao";
  const PREFIXO_FOTOS = SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/";

  let dados = { categorias: [], produtos: [], grupos: [], opcoes: [], vinculos: [], promocoes: [] };
  let abaAtual = "produtos";
  let form = null; // formulário aberto na janela

  /* ---------------- utilidades ---------------- */
  const el = (id) => document.getElementById(id);
  const enc = encodeURIComponent;

  function esc(texto) {
    return String(texto ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function slug(texto) {
    const s = String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    return s || "item";
  }
  function idUnico(base, usados) {
    let id = base, n = 2;
    while (usados.has(id)) id = base + "-" + n++;
    usados.add(id);
    return id;
  }
  function brl(n) { return "R$ " + Number(n).toFixed(2).replace(".", ","); }
  function lerPreco(v) {
    let t = String(v ?? "").trim();
    if (!t) return null;
    t = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t;
    const n = Number(t);
    return Number.isFinite(n) && n >= 0 && n <= 9999.99 ? Math.round(n * 100) / 100 : null;
  }
  // Só aceita endereço de foto "limpo": nome de arquivo do site ou https.
  function urlFoto(v) {
    const s = String(v ?? "").trim();
    if (!s) return "";
    return /^(https:\/\/)?[A-Za-z0-9_\-./:%@?=&+~#]+$/.test(s) ? s : "";
  }
  const porOrdem = (a, b) => (a.ordem || 0) - (b.ordem || 0) || String(a.nome || "").localeCompare(String(b.nome || ""));
  const proximaOrdem = (lista) => lista.reduce((m, x) => Math.max(m, x.ordem || 0), 0) + 1;
  const ehGrupoDeSabor = (g) => String(g.id).startsWith("sabores-");

  function erroTexto(err) {
    if (!err) return "Algo deu errado.";
    if (err.status === 401 || err.status === 403) return "Sem permissão. Saia e entre de novo.";
    return err.message || "Algo deu errado.";
  }
  function avisar(texto, ehErro) {
    const a = el("aviso");
    a.textContent = texto || "";
    a.className = "aviso" + (texto ? (ehErro ? " erro" : " ok") : "");
    clearTimeout(avisar._t);
    if (texto && !ehErro) avisar._t = setTimeout(() => { a.textContent = ""; a.className = "aviso"; }, 4000);
  }

  /* ---------------- sessão (login) ---------------- */
  function lerSessao() { try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO)); } catch (e) { return null; } }
  function salvarSessao(s) { localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)); }
  function limparSessao() { localStorage.removeItem(CHAVE_SESSAO); }

  async function autenticar(corpo, tipo) {
    const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + tipo, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.access_token) { const e = new Error("falha_login"); e.status = res.status; throw e; }
    const s = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expira_em: Date.now() + (Number(d.expires_in) || 3600) * 1000,
      email: (d.user && d.user.email) || (lerSessao() || {}).email || "",
    };
    salvarSessao(s);
    return s;
  }
  async function obterToken() {
    let s = lerSessao();
    if (!s || !s.access_token) return null;
    if (Date.now() > s.expira_em - 60000) {
      try { s = await autenticar({ refresh_token: s.refresh_token }, "refresh_token"); }
      catch (e) { limparSessao(); return null; }
    }
    return s.access_token;
  }

  /* ---------------- acesso ao banco ---------------- */
  async function api(metodo, caminho, corpo, extras) {
    const token = await obterToken();
    if (!token) { mostrarLogin("Sua sessão expirou. Entre de novo."); const e = new Error("Sua sessão expirou. Entre de novo."); e.status = 401; throw e; }
    const res = await fetch(SUPABASE_URL + caminho, {
      method: metodo,
      headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json", Prefer: "return=representation" }, extras || {}),
      body: corpo === undefined ? undefined : JSON.stringify(corpo),
    });
    let d = null;
    try { d = await res.json(); } catch (e) { /* resposta sem corpo */ }
    if (!res.ok) { const e = new Error((d && (d.message || d.error_description || d.error)) || ("Erro " + res.status)); e.status = res.status; throw e; }
    return d;
  }
  const rest = (metodo, tabela, filtro, corpo, extras) => api(metodo, "/rest/v1/" + tabela + (filtro || ""), corpo, extras);

  const NAO_GRAVOU = "Não consegui salvar (sem permissão ou o item não existe mais). Saia e entre de novo.";
  async function lerTabela(tabela) { const d = await rest("GET", tabela, "?select=*"); return Array.isArray(d) ? d : []; }
  async function inserir(tabela, linha) {
    const d = await rest("POST", tabela, "", linha);
    if (!Array.isArray(d) || d.length === 0) throw new Error(NAO_GRAVOU);
    return d[0];
  }
  async function atualizar(tabela, coluna, valor, corpo) {
    const d = await rest("PATCH", tabela, "?" + coluna + "=eq." + enc(valor), corpo);
    // Se o banco recusar a gravação, ele não dá erro: devolve lista vazia.
    if (!Array.isArray(d) || d.length === 0) throw new Error(NAO_GRAVOU);
    return d[0];
  }
  async function apagar(tabela, filtro) {
    const d = await rest("DELETE", tabela, filtro);
    return Array.isArray(d) ? d : [];
  }
  async function upsertVinculos(linhas) {
    if (!linhas.length) return;
    await rest("POST", "produto_grupos", "?on_conflict=produto_id,grupo_id", linhas, { Prefer: "resolution=merge-duplicates,return=representation" });
  }

  async function carregarTudo() {
    const [categorias, produtos, grupos, opcoes, vinculos, promocoes] = await Promise.all([
      lerTabela("categorias"), lerTabela("produtos"), lerTabela("grupos"),
      lerTabela("opcoes"), lerTabela("produto_grupos"), lerTabela("promocoes"),
    ]);
    dados = {
      categorias: categorias.sort(porOrdem),
      produtos: produtos.sort(porOrdem),
      grupos: grupos.sort(porOrdem),
      opcoes: opcoes.sort(porOrdem),
      vinculos,
      promocoes: promocoes.sort(porOrdem),
    };
  }

  /* ---------------- fotos ---------------- */
  // Reduz e otimiza a foto antes de enviar (cabe no limite do bucket e carrega rápido no celular).
  async function prepararImagem(arquivo) {
    if (!arquivo || !/^image\//.test(arquivo.type)) throw new Error("Escolha um arquivo de imagem (JPG, PNG ou WebP).");
    if (arquivo.size > 20 * 1024 * 1024) throw new Error("A imagem é muito grande (máximo 20 MB).");
    let bitmap;
    try { bitmap = await createImageBitmap(arquivo, { imageOrientation: "from-image" }); }
    catch (e) { throw new Error("Não consegui abrir essa imagem. Tente outro arquivo."); }
    const tentativas = [[1000, 0.85], [1000, 0.7], [800, 0.7], [600, 0.65]];
    for (const [maximo, qualidade] of tentativas) {
      const escala = Math.min(1, maximo / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * escala));
      const h = Math.max(1, Math.round(bitmap.height * escala));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, w, h);
      let blob = await new Promise((r) => canvas.toBlob(r, "image/webp", qualidade));
      if (!blob || blob.type !== "image/webp") {
        // navegador sem suporte a WebP: usa JPEG com fundo roxo escuro (cor da marca)
        ctx.globalCompositeOperation = "destination-over";
        ctx.fillStyle = "#2C0A33"; ctx.fillRect(0, 0, w, h);
        blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", qualidade));
      }
      if (blob && blob.size <= 900 * 1024) return blob;
    }
    throw new Error("A imagem ficou grande demais mesmo depois de reduzir. Tente outra foto.");
  }

  async function enviarFoto(blob, nomeBase) {
    const token = await obterToken();
    if (!token) { const e = new Error("Sua sessão expirou. Entre de novo."); e.status = 401; throw e; }
    const ext = blob.type === "image/jpeg" ? "jpg" : blob.type === "image/png" ? "png" : "webp";
    const caminho = Date.now() + "-" + Math.random().toString(36).slice(2, 6) + "-" + slug(nomeBase) + "." + ext;
    const res = await fetch(SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + caminho, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": blob.type, "x-upsert": "false" },
      body: blob,
    });
    if (!res.ok) throw new Error("Não consegui enviar a foto. Confira a internet e se o armazenamento de fotos foi criado (passo do SQL).");
    return PREFIXO_FOTOS + caminho;
  }

  // Apaga uma foto antiga do armazenamento (só as enviadas pelo painel). Falhar aqui não atrapalha nada.
  async function apagarFotoAntiga(url) {
    try {
      if (!url || !String(url).startsWith(PREFIXO_FOTOS)) return;
      const token = await obterToken();
      if (!token) return;
      await fetch(SUPABASE_URL + "/storage/v1/object/" + BUCKET, {
        method: "DELETE",
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ prefixes: [String(url).slice(PREFIXO_FOTOS.length)] }),
      });
    } catch (e) { /* tudo bem */ }
  }

  /* ---------------- gravação: produtos ---------------- */
  function grupoSaboresDe(produtoId) {
    const v = dados.vinculos.find((x) => x.produto_id === produtoId && String(x.grupo_id).startsWith("sabores-"));
    return v ? v.grupo_id : null;
  }

  function validarSabores(sabores) {
    const nomes = sabores.map((s) => String(s.nome || "").trim()).filter(Boolean);
    if (nomes.length === 0) throw new Error("Cadastre pelo menos um sabor.");
    const repetido = nomes.find((n, i) => nomes.findIndex((m) => m.toLowerCase() === n.toLowerCase()) !== i);
    if (repetido) throw new Error('O sabor "' + repetido + '" está repetido.');
  }

  async function sincronizarVinculos(produtoId, grupoIds) {
    const existentes = dados.vinculos.filter((v) => v.produto_id === produtoId);
    await upsertVinculos(grupoIds.map((g, i) => ({ produto_id: produtoId, grupo_id: g, ordem: i + 1 })));
    for (const v of existentes) {
      if (grupoIds.includes(v.grupo_id)) continue;
      await apagar("produto_grupos", "?produto_id=eq." + enc(produtoId) + "&grupo_id=eq." + enc(v.grupo_id));
      // grupo de sabores que sobrou deste produto (a categoria mudou): remove junto com os sabores
      if (String(v.grupo_id).startsWith("sabores-")) await apagar("grupos", "?id=eq." + enc(v.grupo_id));
    }
  }

  async function sincronizarSabores(produtoId, nomeProduto, sabores, apagarDepois) {
    const gid = grupoSaboresDe(produtoId) || ("sabores-" + produtoId);
    if (!dados.grupos.some((g) => g.id === gid)) {
      await inserir("grupos", { id: gid, nome: "Sabor", minimo: 1, maximo: 1 });
      dados.grupos.push({ id: gid, nome: "Sabor", minimo: 1, maximo: 1 });
    }
    const existentes = dados.opcoes.filter((o) => o.grupo_id === gid);
    const usados = new Set(dados.opcoes.map((o) => o.id));
    const mantidos = new Set();
    const lista = sabores.filter((s) => String(s.nome || "").trim());

    for (let i = 0; i < lista.length; i++) {
      const s = lista[i];
      const nomeS = String(s.nome).trim();
      let img = s.imagemAtual || "";
      if (s.fotoNova) {
        const url = await enviarFoto(s.fotoNova, nomeProduto + "-" + nomeS);
        if (img) apagarDepois.push(img);
        img = url; s.imagemAtual = url; s.fotoNova = null; s.fotoPreview = "";
      } else if (s.fotoRemover && img) {
        apagarDepois.push(img); img = ""; s.imagemAtual = ""; s.fotoRemover = false;
      }
      const corpo = { nome: nomeS, imagem: img || null, ordem: i + 1, ativa: s.ativa !== false };
      if (s.id && existentes.some((o) => o.id === s.id)) {
        await atualizar("opcoes", "id", s.id, corpo);
        mantidos.add(s.id);
      } else {
        const id = s.id || idUnico(produtoId + "-" + slug(nomeS), usados);
        await inserir("opcoes", Object.assign({ id, grupo_id: gid }, corpo));
        s.id = id; mantidos.add(id);
      }
    }
    for (const o of existentes) {
      if (mantidos.has(o.id)) continue;
      if (o.imagem) apagarDepois.push(o.imagem);
      await apagar("opcoes", "?id=eq." + enc(o.id));
    }
    await upsertVinculos([{ produto_id: produtoId, grupo_id: gid, ordem: 1 }]);
    for (const v of dados.vinculos.filter((x) => x.produto_id === produtoId && x.grupo_id !== gid)) {
      await apagar("produto_grupos", "?produto_id=eq." + enc(produtoId) + "&grupo_id=eq." + enc(v.grupo_id));
    }
  }

  async function salvarProdutoCompleto(f) {
    const cat = dados.categorias.find((c) => c.id === f.categoria_id);
    if (!cat) throw new Error("Escolha a categoria do produto.");
    const nome = String(f.nome || "").trim();
    if (!nome) throw new Error("Digite o nome do produto.");
    const preco = lerPreco(f.preco);
    if (preco === null) throw new Error("Digite um preço válido, por exemplo 23,90.");
    if (cat.modelo === "sabores") validarSabores(f.sabores);
    const descricao = String(f.descricao || "").trim();

    const apagarDepois = [];
    let imagem = f.imagemAtual || "";
    if (f.fotoNova) {
      const url = await enviarFoto(f.fotoNova, nome);
      if (imagem) apagarDepois.push(imagem);
      imagem = url; f.imagemAtual = url; f.fotoNova = null; f.fotoPreview = "";
    } else if (f.fotoRemover && imagem) {
      apagarDepois.push(imagem); imagem = ""; f.imagemAtual = ""; f.fotoRemover = false;
    }

    const campos = { categoria_id: cat.id, nome, descricao: descricao || null, preco, imagem: imagem || null, destaque: !!f.destaque };
    const existente = f.id ? dados.produtos.find((p) => p.id === f.id) : null;
    const daCategoria = dados.produtos.filter((p) => p.categoria_id === cat.id);
    if (!existente) {
      const id = f.id || idUnico(slug(nome), new Set(dados.produtos.map((p) => p.id)));
      // produto novo nasce desativado e só é ativado no fim: se algo falhar no meio, ele não aparece pela metade no site
      await inserir("produtos", Object.assign({ id }, campos, { ordem: proximaOrdem(daCategoria), ativo: false }));
      f.id = id;
    } else {
      if (existente.categoria_id !== cat.id) campos.ordem = proximaOrdem(daCategoria);
      await atualizar("produtos", "id", f.id, campos);
    }

    if (cat.modelo === "monta") await sincronizarVinculos(f.id, [...f.grupos]);
    else await sincronizarSabores(f.id, nome, f.sabores, apagarDepois);

    await atualizar("produtos", "id", f.id, { ativo: !!f.ativo });
    apagarDepois.forEach((u) => apagarFotoAntiga(u));
    return f.id;
  }

  async function excluirProduto(id) {
    const p = dados.produtos.find((x) => x.id === id);
    if (!p) return;
    const fotos = [p.imagem];
    const gid = grupoSaboresDe(id);
    if (gid) dados.opcoes.filter((o) => o.grupo_id === gid).forEach((o) => fotos.push(o.imagem));
    await apagar("produtos", "?id=eq." + enc(id));
    if (gid) await apagar("grupos", "?id=eq." + enc(gid));
    fotos.forEach((u) => apagarFotoAntiga(u));
  }

  async function alternarAtivo(tabela, coluna, id, valor) {
    await atualizar(tabela, "id", id, { [coluna]: !!valor });
  }

  async function moverOrdem(tabela, lista, id, delta) {
    const ord = [...lista].sort(porOrdem);
    const i = ord.findIndex((x) => x.id === id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= ord.length) return;
    const nova = ord.map((x, k) => ({ id: x.id, ordem: k + 1 }));
    [nova[i].ordem, nova[j].ordem] = [nova[j].ordem, nova[i].ordem];
    for (const x of nova) {
      const atual = ord.find((o) => o.id === x.id);
      if ((atual.ordem || 0) !== x.ordem) await atualizar(tabela, "id", x.id, { ordem: x.ordem });
    }
  }

  /* ---------------- gravação: categorias ---------------- */
  async function salvarCategoriaCompleta(f) {
    const nome = String(f.nome || "").trim();
    if (!nome) throw new Error("Digite o nome da categoria.");
    if (!["monta", "sabores"].includes(f.modelo)) throw new Error("Escolha como os produtos dessa categoria são vendidos.");
    if (!f.id) {
      const id = idUnico(slug(nome), new Set(dados.categorias.map((c) => c.id)));
      await inserir("categorias", { id, nome, modelo: f.modelo, ordem: proximaOrdem(dados.categorias), ativa: true });
      f.id = id;
    } else {
      const corpo = { nome };
      if (!dados.produtos.some((p) => p.categoria_id === f.id)) corpo.modelo = f.modelo;
      await atualizar("categorias", "id", f.id, corpo);
    }
  }
  async function excluirCategoria(id) {
    if (dados.produtos.some((p) => p.categoria_id === id)) throw new Error("Essa categoria ainda tem produtos. Mude ou exclua os produtos antes.");
    await apagar("categorias", "?id=eq." + enc(id));
  }

  /* ---------------- gravação: grupos de complementos ---------------- */
  async function salvarGrupoCompleto(f) {
    const nome = String(f.nome || "").trim();
    if (!nome) throw new Error("Digite o nome do grupo.");
    let maximo = null;
    const txt = String(f.maximo ?? "").trim();
    if (txt !== "") {
      maximo = Number(txt);
      if (!Number.isInteger(maximo) || maximo < 1 || maximo > 50) throw new Error("O limite precisa ser um número de 1 a 50 (ou deixe vazio para não ter limite).");
    }
    const itens = f.itens.filter((i) => String(i.nome || "").trim());
    if (itens.length === 0) throw new Error("Cadastre pelo menos um item no grupo.");
    const nomes = itens.map((i) => i.nome.trim().toLowerCase());
    const repetido = itens.find((i, k) => nomes.indexOf(i.nome.trim().toLowerCase()) !== k);
    if (repetido) throw new Error('O item "' + repetido.nome.trim() + '" está repetido.');

    if (!f.id) {
      const id = idUnico(slug(nome), new Set(dados.grupos.map((g) => g.id)));
      const ordem = proximaOrdem(dados.grupos.filter((g) => !ehGrupoDeSabor(g)));
      await inserir("grupos", { id, nome, minimo: 0, maximo, ordem });
      dados.grupos.push({ id, nome, minimo: 0, maximo, ordem });
      f.id = id;
    } else {
      await atualizar("grupos", "id", f.id, { nome, maximo });
    }
    const existentes = dados.opcoes.filter((o) => o.grupo_id === f.id);
    const usados = new Set(dados.opcoes.map((o) => o.id));
    const mantidos = new Set();
    for (let i = 0; i < itens.length; i++) {
      const it = itens[i];
      const corpo = { nome: it.nome.trim(), ordem: i + 1, ativa: it.ativa !== false };
      if (it.id && existentes.some((o) => o.id === it.id)) {
        await atualizar("opcoes", "id", it.id, corpo);
        mantidos.add(it.id);
      } else {
        const id = it.id || idUnico(f.id + "-" + slug(corpo.nome), usados);
        await inserir("opcoes", Object.assign({ id, grupo_id: f.id }, corpo));
        it.id = id; mantidos.add(id);
      }
    }
    for (const o of existentes) if (!mantidos.has(o.id)) await apagar("opcoes", "?id=eq." + enc(o.id));
  }
  async function excluirGrupo(id) {
    await apagar("grupos", "?id=eq." + enc(id)); // os itens e as ligações com produtos saem junto
  }

  /* ---------------- gravação: promoções ---------------- */
  const TIPOS_PROMO = {
    percentual: "Desconto em porcentagem",
    pacote_preco: "Pacote por preço fechado (ex.: 3 por R$ 30)",
    leve_ganhe: "Leve X e ganhe Y",
    upgrade: "Troca de tamanho pagando a diferença",
    brinde: "Brinde ao comprar",
    informativa: "Só um aviso (sem desconto)",
  };

  const nomeProduto = (id) => (dados.produtos.find((p) => p.id === id) || {}).nome;
  const nomeCategoria = (id) => (dados.categorias.find((c) => c.id === id) || {}).nome;
  function juntar(nomes, conj) {
    const l = nomes.filter(Boolean);
    if (l.length <= 1) return l[0] || "";
    return l.slice(0, -1).join(", ") + " " + (conj || "e") + " " + l[l.length - 1];
  }
  const dataBR = (d) => (d ? String(d).slice(8, 10) + "/" + String(d).slice(5, 7) : "");

  function resumoPromocao(p) {
    const onde = (escopo, alvos) => escopo === "todos" ? "todos os produtos"
      : (juntar((escopo === "categorias" ? alvos.map(nomeCategoria) : alvos.map(nomeProduto))) || "(nada escolhido)");
    const alvos = Array.isArray(p.alvos) ? p.alvos : [];
    const alvosBrinde = Array.isArray(p.alvos_brinde) ? p.alvos_brinde : [];
    let t;
    switch (p.tipo) {
      case "percentual": t = p.valor + "% de desconto em " + onde(p.escopo, alvos); break;
      case "pacote_preco": t = "Leve " + p.quantidade + " por " + brl(p.valor) + ": " + onde(p.escopo, alvos); break;
      case "leve_ganhe": t = "Compre " + p.quantidade + " (" + onde(p.escopo, alvos) + ") e ganhe " + p.brinde_quantidade + " (" + onde("produtos", alvosBrinde) + ")"; break;
      case "upgrade": t = "Troca de " + onde("produtos", alvos) + " por " + (nomeProduto(alvosBrinde[0]) || "?") + " pagando +" + brl(p.valor); break;
      case "brinde": t = "Brinde (" + (p.brinde_item || "brinde") + ") ao comprar " + onde(p.escopo, alvos); break;
      default: t = p.descricao || "Aviso na página inicial";
    }
    if (p.inicio || p.fim) t += " · " + (p.inicio ? "de " + dataBR(p.inicio) : "") + (p.fim ? " até " + dataBR(p.fim) : "");
    return t;
  }

  function novoFormPromocao(p) {
    const tp = p ? (p.tipo || "informativa") : "percentual";
    return {
      tipo: "promocao",
      id: p ? p.id : null,
      nome: p ? p.nome : "",
      tipoPromo: tp,
      escopo: p ? (p.escopo || "todos") : "todos",
      alvos: new Set(p && Array.isArray(p.alvos) ? p.alvos : []),
      alvosBrinde: new Set(p && Array.isArray(p.alvos_brinde) ? p.alvos_brinde : []),
      para: p && Array.isArray(p.alvos_brinde) ? (p.alvos_brinde[0] || "") : "",
      quantidade: p && p.quantidade ? String(p.quantidade) : "",
      brindeQuantidade: p && p.brinde_quantidade ? String(p.brinde_quantidade) : "1",
      valor: p && p.valor !== null && p.valor !== undefined ? String(p.valor).replace(".", ",") : "",
      descricao: p ? (p.descricao || "") : "",
      inicio: p ? (p.inicio || "") : "",
      fim: p ? (p.fim || "") : "",
      ativa: p ? !!p.ativa : false,
      brindeTitulo: p ? (p.brinde_titulo || "") : "",
      brindeItem: p ? (p.brinde_item || "") : "",
      opcoes: p && Array.isArray(p.brinde_opcoes) ? p.brinde_opcoes.map((o) => ({ nome: o.nome, imagemAtual: o.imagem || "", fotoNova: null, fotoPreview: "", fotoRemover: false })) : [],
    };
  }
  const novaOpcaoBrinde = () => ({ nome: "", imagemAtual: "", fotoNova: null, fotoPreview: "", fotoRemover: false });

  function lerInteiro(txt, min, max, mensagem) {
    const t = String(txt ?? "").trim();
    const n = Number(t);
    if (t === "" || !Number.isInteger(n) || n < min || n > max) throw new Error(mensagem);
    return n;
  }

  async function salvarPromocaoCompleta(f) {
    const nome = String(f.nome || "").trim();
    if (!nome) throw new Error("Digite o nome da promoção.");
    const tipo = f.tipoPromo;
    if (!TIPOS_PROMO[tipo]) throw new Error("Escolha o tipo da promoção.");
    if (f.inicio && f.fim && f.inicio > f.fim) throw new Error("A data final não pode ser antes da data inicial.");

    const escopo = tipo === "upgrade" ? "produtos" : tipo === "informativa" ? "todos" : f.escopo;
    const alvos = escopo === "todos" ? [] : [...f.alvos];
    if (escopo !== "todos" && alvos.length === 0) throw new Error("Escolha onde a promoção vale (marque pelo menos um item).");

    const corpo = {
      nome, tipo, escopo, alvos,
      quantidade: null, brinde_quantidade: 1, alvos_brinde: [], valor: null,
      descricao: String(f.descricao || "").trim() || null,
      inicio: f.inicio || null, fim: f.fim || null,
      brinde_titulo: null, brinde_item: null, brinde_opcoes: [],
      ativa: !!f.ativa,
    };

    if (tipo === "percentual") {
      const v = Number(String(f.valor).replace(",", "."));
      if (!Number.isFinite(v) || v <= 0 || v > 50) throw new Error("O desconto em porcentagem vai de 1 a 50.");
      corpo.valor = v;
    } else if (tipo === "pacote_preco") {
      corpo.quantidade = lerInteiro(f.quantidade, 2, 20, "Digite quantas unidades formam o pacote (de 2 a 20).");
      const v = lerPreco(f.valor);
      if (v === null) throw new Error("Digite o preço do pacote, por exemplo 30.");
      corpo.valor = v;
    } else if (tipo === "leve_ganhe") {
      corpo.quantidade = lerInteiro(f.quantidade, 1, 20, "Digite quantas unidades o cliente precisa comprar (de 1 a 20).");
      corpo.brinde_quantidade = lerInteiro(f.brindeQuantidade, 1, 10, "Digite quantas unidades o cliente ganha (de 1 a 10).");
      corpo.alvos_brinde = [...f.alvosBrinde];
      if (corpo.alvos_brinde.length === 0) throw new Error("Escolha qual produto o cliente ganha.");
    } else if (tipo === "upgrade") {
      if (!f.para) throw new Error("Escolha o produto para o qual o cliente pode trocar.");
      if (f.alvos.has(f.para)) throw new Error("O produto de destino não pode estar entre os que são trocados.");
      const v = lerPreco(f.valor);
      if (v === null) throw new Error("Digite quanto o cliente paga a mais, por exemplo 3.");
      corpo.valor = v;
      corpo.alvos_brinde = [f.para];
    } else if (tipo === "brinde") {
      const lista = f.opcoes.filter((o) => String(o.nome || "").trim());
      if (lista.length === 0) throw new Error("Cadastre pelo menos uma opção de brinde.");
      const nomes = lista.map((o) => o.nome.trim().toLowerCase());
      if (nomes.some((n, i) => nomes.indexOf(n) !== i)) throw new Error("Tem opção de brinde repetida.");
      corpo.brinde_item = String(f.brindeItem || "").trim() || "brinde";
      corpo.brinde_titulo = String(f.brindeTitulo || "").trim() || ("Ganhe " + corpo.brinde_item + " grátis!");
      const apagarDepois = [];
      const saida = [];
      for (const o of lista) {
        let img = o.imagemAtual || "";
        if (o.fotoNova) {
          const url = await enviarFoto(o.fotoNova, nome + "-" + o.nome);
          if (img) apagarDepois.push(img);
          img = url; o.imagemAtual = url; o.fotoNova = null; o.fotoPreview = "";
        } else if (o.fotoRemover && img) { apagarDepois.push(img); img = ""; o.imagemAtual = ""; o.fotoRemover = false; }
        saida.push({ nome: o.nome.trim(), imagem: img || null });
      }
      corpo.brinde_opcoes = saida;
      f._apagarDepois = apagarDepois;
    } else if (tipo === "informativa") {
      if (!corpo.descricao) throw new Error("Escreva o texto do aviso.");
    }

    const existente = f.id ? dados.promocoes.find((p) => p.id === f.id) : null;
    if (!existente) {
      const id = f.id || idUnico(slug(nome), new Set(dados.promocoes.map((p) => p.id)));
      await inserir("promocoes", Object.assign({ id, ordem: proximaOrdem(dados.promocoes) }, corpo));
      f.id = id;
    } else {
      await atualizar("promocoes", "id", f.id, corpo);
    }
    (f._apagarDepois || []).forEach((u) => apagarFotoAntiga(u));
    return f.id;
  }
  async function excluirPromocao(id) {
    const p = dados.promocoes.find((x) => x.id === id);
    await apagar("promocoes", "?id=eq." + enc(id));
    if (p && Array.isArray(p.brinde_opcoes)) p.brinde_opcoes.forEach((o) => apagarFotoAntiga(o.imagem));
  }

  function renderComplementos() {
    const grupos = dados.grupos.filter((g) => !ehGrupoDeSabor(g));
    let html = '<div class="barra"><button type="button" class="btn" data-acao="novo-grupo">+ Novo grupo</button></div>' +
      '<p class="dica">Grupos de complementos são as listas que o cliente escolhe ao montar o açaí (Completos, Coberturas, Frutas…). O mesmo grupo pode ser usado em vários produtos.</p>';
    if (grupos.length === 0) html += '<p class="vazio">Nenhum grupo ainda.</p>';

    el("modalFundo").scrollTop = 0;
  }
  function fecharModal() {
    el("modalFundo").hidden = true;
    el("modal").innerHTML = "";
    document.body.style.overflow = "";
    if (form) {
      if (form.fotoPreview) URL.revokeObjectURL(form.fotoPreview);
      (form.sabores || []).forEach((s) => s.fotoPreview && URL.revokeObjectURL(s.fotoPreview));
      (form.opcoes || []).forEach((o) => o.fotoPreview && URL.revokeObjectURL(o.fotoPreview));
    }
    form = null;
  }
  function erroModal(texto) {
    const e = el("erroModal");

    e.textContent = texto; e.hidden = !texto;

  }

  /* ---------------- ações ---------------- */
  async function comBotaoOcupado(fn) {
    const b = el("btnSalvarModal");
    if (b) { b.disabled = true; b.textContent = "Salvando…"; }
    try { await fn(); return true; }
    catch (err) {
      erroModal(erroTexto(err));
      if (b) { b.disabled = false; b.textContent = "Salvar"; }
      try { await carregarTudo(); renderAba(); } catch (e) { /* segue */ }
      return false;
    }
  }
  async function depoisDeSalvar(mensagem) {
    await carregarTudo();
    fecharModal();
    renderAba();
    avisar(mensagem);
  }
  function trocar(lista, i, j) { if (j >= 0 && j < lista.length) [lista[i], lista[j]] = [lista[j], lista[i]]; }

  async function escolherFoto(alvo, arquivo) {
    if (!arquivo) return;
    try {
      const blob = await prepararImagem(arquivo);
      if (alvo.fotoPreview) URL.revokeObjectURL(alvo.fotoPreview);
      alvo.fotoNova = blob; alvo.fotoPreview = URL.createObjectURL(blob); alvo.fotoRemover = false;
      if (form.tipo === "produto") renderModalProduto();
    } catch (err) { erroModal(erroTexto(err)); }
  }

  const acoes = {
    "novo-produto": () => { if (!dados.categorias.length) return avisar("Crie uma categoria primeiro.", true); form = novoFormProduto(null); renderModalProduto(); },
    "editar-produto": (id) => { form = novoFormProduto(dados.produtos.find((p) => p.id === id)); renderModalProduto(); },
    "subir-produto": async (id) => { const p = dados.produtos.find((x) => x.id === id); await moverOrdem("produtos", dados.produtos.filter((x) => x.categoria_id === p.categoria_id), id, -1); await carregarTudo(); renderAba(); },
    "descer-produto": async (id) => { const p = dados.produtos.find((x) => x.id === id); await moverOrdem("produtos", dados.produtos.filter((x) => x.categoria_id === p.categoria_id), id, 1); await carregarTudo(); renderAba(); },
    "novo-grupo": () => { form = { tipo: "grupo", id: null, nome: "", maximo: "", itens: [{ id: null, nome: "", ativa: true }] }; renderModalGrupo(); },
    "editar-grupo": (id) => {
      const g = dados.grupos.find((x) => x.id === id);
      form = { tipo: "grupo", id, nome: g.nome, maximo: g.maximo === null || g.maximo === undefined ? "" : String(g.maximo),
        itens: dados.opcoes.filter((o) => o.grupo_id === id).sort(porOrdem).map((o) => ({ id: o.id, nome: o.nome, ativa: o.ativa !== false })) };
      renderModalGrupo();
    },
    "subir-grupo": async (id) => { await moverOrdem("grupos", dados.grupos.filter((g) => !ehGrupoDeSabor(g)), id, -1); await carregarTudo(); renderAba(); },
    "descer-grupo": async (id) => { await moverOrdem("grupos", dados.grupos.filter((g) => !ehGrupoDeSabor(g)), id, 1); await carregarTudo(); renderAba(); },
    "nova-categoria": () => { form = { tipo: "categoria", id: null, nome: "", modelo: "monta" }; renderModalCategoria(); },
    "editar-categoria": (id) => { const c = dados.categorias.find((x) => x.id === id); form = { tipo: "categoria", id, nome: c.nome, modelo: c.modelo }; renderModalCategoria(); },
    "subir-categoria": async (id) => { await moverOrdem("categorias", dados.categorias, id, -1); await carregarTudo(); renderAba(); },
    "descer-categoria": async (id) => { await moverOrdem("categorias", dados.categorias, id, 1); await carregarTudo(); renderAba(); },

    "nova-promocao": () => { form = novoFormPromocao(null); renderModalPromocao(); },
    "editar-promocao": (id) => { form = novoFormPromocao(dados.promocoes.find((p) => p.id === id)); renderModalPromocao(); },
    "subir-promocao": async (id) => { await moverOrdem("promocoes", dados.promocoes, id, -1); await carregarTudo(); renderAba(); },
    "descer-promocao": async (id) => { await moverOrdem("promocoes", dados.promocoes, id, 1); await carregarTudo(); renderAba(); },
    "salvar-promocao": async () => { if (await comBotaoOcupado(() => salvarPromocaoCompleta(form))) await depoisDeSalvar("✅ Promoção salva."); },
    "excluir-promocao": async () => {
      if (!confirm("Excluir esta promoção? Se for só pra pausar, é melhor desligar.")) return;
      const id = form.id;
      if (await comBotaoOcupado(() => excluirPromocao(id))) await depoisDeSalvar("Promoção excluída.");
    },
    "add-brinde-opcao": () => { form.opcoes.push(novaOpcaoBrinde()); renderModalPromocao(); },
    "remover-brinde-opcao": (id, a, i) => { form.opcoes.splice(i, 1); renderModalPromocao(); },
    "subir-brinde-opcao": (id, a, i) => { trocar(form.opcoes, i, i - 1); renderModalPromocao(); },
    "descer-brinde-opcao": (id, a, i) => { trocar(form.opcoes, i, i + 1); renderModalPromocao(); },
    "remover-foto-brinde": (id, a, i) => { const o = form.opcoes[i]; if (o.fotoPreview) URL.revokeObjectURL(o.fotoPreview); o.fotoNova = null; o.fotoPreview = ""; o.fotoRemover = true; renderModalPromocao(); },

    "cancelar-modal": () => fecharModal(),
    "salvar-produto": async () => { if (await comBotaoOcupado(() => salvarProdutoCompleto(form))) await depoisDeSalvar("✅ Produto salvo."); },
    "salvar-categoria": async () => { if (await comBotaoOcupado(() => salvarCategoriaCompleta(form))) await depoisDeSalvar("✅ Categoria salva."); },
    "salvar-grupo": async () => { if (await comBotaoOcupado(() => salvarGrupoCompleto(form))) await depoisDeSalvar("✅ Grupo salvo."); },
    "excluir-produto": async () => {
      if (!confirm("Excluir este produto de vez? Se ele só acabou, é melhor desmarcar \"Aparece no site\".")) return;
      const id = form.id;
      if (await comBotaoOcupado(() => excluirProduto(id))) await depoisDeSalvar("Produto excluído.");
    },
    "excluir-categoria": async () => {
      if (!confirm("Excluir esta categoria?")) return;
      const id = form.id;
      if (await comBotaoOcupado(() => excluirCategoria(id))) await depoisDeSalvar("Categoria excluída.");
    },
    "excluir-grupo": async () => {
      const id = form.id;
      const usos = dados.vinculos.filter((v) => v.grupo_id === id).length;
      if (!confirm("Excluir este grupo e todos os itens dele?" + (usos ? " Ele deixa de aparecer em " + usos + " produto(s)." : ""))) return;
      if (await comBotaoOcupado(() => excluirGrupo(id))) await depoisDeSalvar("Grupo excluído.");
    },

    "remover-foto-produto": () => { if (form.fotoPreview) URL.revokeObjectURL(form.fotoPreview); form.fotoNova = null; form.fotoPreview = ""; form.fotoRemover = true; renderModalProduto(); },
    "add-sabor": () => { form.sabores.push(novoSabor()); renderModalProduto(); },
    "remover-sabor": (id, a, i) => { form.sabores.splice(i, 1); renderModalProduto(); },
    "subir-sabor": (id, a, i) => { trocar(form.sabores, i, i - 1); renderModalProduto(); },
    "descer-sabor": (id, a, i) => { trocar(form.sabores, i, i + 1); renderModalProduto(); },
    "remover-foto-sabor": (id, a, i) => { const s = form.sabores[i]; if (s.fotoPreview) URL.revokeObjectURL(s.fotoPreview); s.fotoNova = null; s.fotoPreview = ""; s.fotoRemover = true; renderModalProduto(); },
    "add-item": () => { form.itens.push({ id: null, nome: "", ativa: true }); renderModalGrupo(); },
    "remover-item": (id, a, i) => { form.itens.splice(i, 1); renderModalGrupo(); },
    "subir-item": (id, a, i) => { trocar(form.itens, i, i - 1); renderModalGrupo(); },
    "descer-item": (id, a, i) => { trocar(form.itens, i, i + 1); renderModalGrupo(); },
  };

  document.addEventListener("click", async (e) => {
    const aba = e.target.closest && e.target.closest("[data-aba]");
    if (aba) { abaAtual = aba.dataset.aba; avisar(""); renderAba(); return; }
    const alvo = e.target.closest && e.target.closest("[data-acao]");
    if (!alvo) return;
    const fn = acoes[alvo.dataset.acao];
    if (!fn) return;
    try { await fn(alvo.dataset.id, alvo, Number(alvo.dataset.i)); }
    catch (err) { avisar(erroTexto(err), true); try { await carregarTudo(); renderAba(); } catch (x) { /* segue */ } }
  });

  // campos de texto e caixas de marcar: só guardam o valor (não redesenham a janela)
  document.addEventListener("input", (e) => {
    const t = e.target, c = t.dataset && t.dataset.campo;
    if (!c || !form) return;
    const i = Number(t.dataset.i);
    switch (c) {
      case "prod-nome": form.nome = t.value; break;
      case "prod-descricao": form.descricao = t.value; break;
      case "prod-preco": form.preco = t.value; break;
      case "prod-destaque": form.destaque = t.checked; break;
      case "prod-ativo": form.ativo = t.checked; break;
      case "prod-grupo": if (t.checked) form.grupos.add(t.dataset.id); else form.grupos.delete(t.dataset.id); break;
      case "sabor-nome": form.sabores[i].nome = t.value; break;
      case "sabor-ativa": form.sabores[i].ativa = t.checked; break;
      case "grupo-nome": case "cat-nome": form.nome = t.value; break;
      case "grupo-maximo": form.maximo = t.value; break;
      case "item-nome": form.itens[i].nome = t.value; break;
      case "item-ativa": form.itens[i].ativa = t.checked; break;
      case "promo-nome": form.nome = t.value; break;
      case "promo-valor": form.valor = t.value; break;
      case "promo-qtd": form.quantidade = t.value; break;
      case "promo-brinde-qtd": form.brindeQuantidade = t.value; break;
      case "promo-descricao": form.descricao = t.value; break;
      case "promo-inicio": form.inicio = t.value; break;
      case "promo-fim": form.fim = t.value; break;
      case "promo-ativa": form.ativa = t.checked; break;
      case "promo-brinde-titulo": form.brindeTitulo = t.value; break;
      case "promo-brinde-item": form.brindeItem = t.value; break;
      case "brinde-nome": form.opcoes[i].nome = t.value; break;
      case "promo-alvo": if (t.checked) form.alvos.add(t.dataset.id); else form.alvos.delete(t.dataset.id); break;
      case "promo-alvo-brinde": if (t.checked) form.alvosBrinde.add(t.dataset.id); else form.alvosBrinde.delete(t.dataset.id); break;
      default: break;
    }
  });

  document.addEventListener("change", async (e) => {
    const t = e.target, c = t.dataset && t.dataset.campo, tog = t.dataset && t.dataset.toggle;
    try {
      if (tog === "produto-ativo") { await alternarAtivo("produtos", "ativo", t.dataset.id, t.checked); await carregarTudo(); renderAba(); avisar("✅ Salvo."); }
      else if (tog === "categoria-ativa") { await alternarAtivo("categorias", "ativa", t.dataset.id, t.checked); await carregarTudo(); renderAba(); avisar("✅ Salvo."); }
      else if (tog === "promo-ativa") { await alternarAtivo("promocoes", "ativa", t.dataset.id, t.checked); await carregarTudo(); renderAba(); avisar("✅ Salvo! Já está valendo no site."); }
      else if (c === "promo-tipo" && form) { form.tipoPromo = t.value; if (t.value === "upgrade") form.escopo = "produtos"; renderModalPromocao(); }
      else if (c === "promo-escopo" && form) { form.escopo = t.value; form.alvos = new Set(); renderModalPromocao(); }
      else if (c === "promo-para" && form) { form.para = t.value; }
      else if (c === "brinde-foto" && form) { await escolherFoto(form.opcoes[Number(t.dataset.i)], t.files && t.files[0]); renderModalPromocao(); }
      else if (c === "prod-categoria" && form) { form.categoria_id = t.value; renderModalProduto(); }
      else if (c === "cat-modelo" && form) { form.modelo = t.value; }
      else if (c === "prod-foto" && form) { await escolherFoto(form, t.files && t.files[0]); }
      else if (c === "sabor-foto" && form) { await escolherFoto(form.sabores[Number(t.dataset.i)], t.files && t.files[0]); renderModalProduto(); }
    } catch (err) {
      avisar(erroTexto(err), true);
      try { await carregarTudo(); renderAba(); } catch (x) { /* segue */ }
    }
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !el("modalFundo").hidden) fecharModal(); });

  el("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const botao = el("btnEntrar");
    botao.disabled = true; botao.textContent = "Entrando…";
    try {
      await autenticar({ email: el("campoEmail").value.trim(), password: el("campoSenha").value }, "password");
      el("campoSenha").value = "";
      await abrirPainel();
    } catch (erro) {
      mostrarLogin(erro.status === 400 || erro.status === 401 ? "E-mail ou senha incorretos." : "Não consegui entrar agora. Confira a internet e tente de novo.");
    } finally { botao.disabled = false; botao.textContent = "Entrar"; }
  });

  el("btnSair").addEventListener("click", () => {
    const s = lerSessao();
    limparSessao();
    if (s && s.access_token) {
      fetch(SUPABASE_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + s.access_token } }).catch(() => {});
    }
    mostrarLogin("");
  });

  (async function iniciar() {
    const token = await obterToken();
    if (token) await abrirPainel(); else mostrarLogin("");
  })();
</script>
</body>
</html>
